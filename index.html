<style>
/* Layout: one-screen mission console, single column, dark by design (early morning, space theme) */
:root{
  --space:#0a0f24; --panel:#141b38; --panel2:#1c2550; --line:#2c3770;
  --text:#eef1ff; --muted:#9aa5d6; --cyan:#62e3ff; --orange:#ff8a3d; --gold:#ffd166;
  --good:#5ff2a0; --warn:#ffb347; --bad:#ff5d6c;
  --f-display:"Chakra Petch",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
.sync{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}.sync.ok{background:var(--good)}.sync.offline{background:var(--warn)}.sync.error{background:var(--bad)}
.code{font-family:var(--f-mono);font-size:2.2rem;font-weight:700;letter-spacing:.12em;text-align:center;color:var(--gold);background:var(--space);border:2px dashed var(--line);border-radius:12px;padding:14px;-webkit-user-select:all;user-select:all}
.banner{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:12px;font-weight:700}
html,body{height:100%}
body{background:var(--space);color:var(--text);font-family:var(--f-body);font-size:17px;line-height:1.45;
  background-image:radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 72% 9%,#fff6 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 38% 62%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 88% 44%,#fff7 50%,transparent 51%),
  radial-gradient(1px 1px at 22% 84%,#fff5 50%,transparent 51%),radial-gradient(1.5px 1.5px at 60% 30%,#fff4 50%,transparent 51%),
  radial-gradient(1px 1px at 93% 78%,#fff6 50%,transparent 51%),radial-gradient(120% 60% at 50% 110%,#1d2a6b 0%,transparent 60%);
  background-attachment:fixed;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:1.9rem;line-height:1.1}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:12px 18px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:1rem}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-go{background:linear-gradient(180deg,#ff9d55,#ff6f1f);border-color:#ffb27a;color:#1a0d00;font-family:var(--f-display);font-size:1.25rem;letter-spacing:.04em;min-height:68px;box-shadow:0 6px 24px #ff6f1f55}
.btn-cyan{background:linear-gradient(180deg,#7debff,#2fc3ea);border-color:#a7f2ff;color:#04202a}
.btn-ghost{background:transparent}
.btn-sm{min-height:40px;padding:8px 12px;font-size:.9rem}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase}
.brand b{color:var(--orange)}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.iconbtn svg{width:22px;height:22px}
.countdown{font-family:var(--f-mono);font-size:3.1rem;font-weight:700;line-height:1;letter-spacing:-.02em}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv>div{background:var(--panel2);border-radius:10px;padding:10px 8px;text-align:center;min-width:0}
.kv .v{font-family:var(--f-mono);font-size:1.25rem;font-weight:700}
.kv .k{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.xpbar{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));border-radius:99px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
.chip.good{color:var(--good);border-color:#2f7d58}.chip.warn{color:var(--warn);border-color:#7d5a2f}.chip.bad{color:var(--bad);border-color:#7d2f39}.chip.gold{color:var(--gold);border-color:#7d6a2f}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nav .btn{flex-direction:column;gap:4px;font-size:.85rem;min-height:68px}
.nav svg{width:24px;height:24px}
/* stages */
.stages{display:flex;gap:4px}
.stages i{flex:1;height:8px;border-radius:4px;background:var(--panel2)}
.stages i.done{background:var(--cyan)}
.stages i.now{background:var(--orange);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.45}}
.mc{font-family:var(--f-mono);font-size:.86rem;color:var(--cyan);background:#62e3ff12;border-left:3px solid var(--cyan);padding:10px 12px;border-radius:0 10px 10px 0}
.ringwrap{position:relative;width:min(72vw,280px);aspect-ratio:1;max-width:100%;margin:6px auto}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringwrap .t{font-family:var(--f-mono);font-size:3.2rem;font-weight:700;line-height:1}
.ghostline{display:flex;justify-content:space-between;font-size:.9rem}
.tile{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);text-align:left;width:100%;font-weight:700;font-size:1.05rem}
.tile .box{width:30px;height:30px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;flex:none}
.tile.on{border-color:var(--good)}.tile.on .box{background:var(--good);border-color:var(--good);color:#032}
.tile small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.alarm{animation:alarmbg .6s infinite alternate}
@keyframes alarmbg{from{background:#3a0b14}to{background:#7a1a12}}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:400}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.faster{color:var(--good)}.slower{color:var(--warn)}
.joke{font-style:italic;background:var(--panel2);border-radius:12px;padding:14px;border:1px dashed var(--line)}
.joke .punch{font-style:normal;font-weight:700;color:var(--gold);margin-top:6px}
.badge{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.badge .medal{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold) 45%,#b07a10);color:#3a2600;font-family:var(--f-display);font-weight:700;flex:none}
.badge.off{opacity:.38}.badge.off .medal{background:var(--panel);color:var(--muted);border:1px dashed var(--muted)}
.reward{display:flex;gap:12px;align-items:center;justify-content:space-between}
.reward .cost{font-family:var(--f-mono);font-weight:700;color:var(--gold)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--text);background:var(--space);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
textarea{min-height:90px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.list{display:flex;flex-direction:column;gap:8px}
.logitem{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;padding-top:6px}
.bars i{flex:1;border-radius:4px 4px 0 0;background:var(--cyan);min-height:4px;position:relative}
.bars i.late{background:var(--warn)}
/* overlays */
#modal{position:fixed;inset:0;background:#050817cc;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal .box{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pinpad button{min-height:58px;border-radius:12px;background:var(--panel2);font-family:var(--f-mono);font-size:1.4rem;font-weight:700}
.pindots{display:flex;gap:12px;justify-content:center}
.pindots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.pindots i.on{background:var(--cyan);border-color:var(--cyan)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#fx{position:fixed;inset:0;z-index:49;pointer-events:none}
#win{position:fixed;inset:0;z-index:48;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;overflow:hidden;
 padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
 background:radial-gradient(circle at 50% 45%,var(--wc2) 0%,transparent 62%),#0a0f24;--wc:var(--gold);--wc2:#ffd16666}
#win.ghost{--wc:var(--cyan);--wc2:#62e3ff55}
#win .rays{position:absolute;left:50%;top:45%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;background:repeating-conic-gradient(from 0deg,var(--wc2) 0 8deg,transparent 8deg 18deg);opacity:.5;animation:spin 9s linear infinite}
#win>*:not(.rays){position:relative}
#win .kicker{font-family:var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--text);font-size:.85rem;animation:pop2 .4s .1s both}
#win h1{font-size:clamp(2.3rem,12vw,3.8rem);color:var(--wc);text-shadow:0 0 28px var(--wc),0 0 70px #ff8a3d88;animation:slam .55s cubic-bezier(.2,1.6,.4,1) both;line-height:1}
#win .big{font-family:var(--f-mono);font-size:clamp(3.2rem,18vw,5.5rem);font-weight:700;line-height:1;animation:pop2 .5s .35s both}
#win .delta{font-size:1.2rem;font-weight:700;color:var(--good);animation:pop2 .5s .55s both}
#win .xps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;animation:pop2 .5s .8s both}
#win .xps span{font-family:var(--f-mono);font-weight:700;font-size:1.3rem;color:#2a1d00;background:var(--gold);padding:6px 14px;border-radius:99px;box-shadow:0 0 24px #ffd16699}
#win .tap{color:var(--muted);font-size:.85rem;margin-top:14px;animation:pulse 1.4s infinite}
.flash{position:fixed;inset:0;z-index:47;background:#fff;pointer-events:none;animation:flashout .6s forwards}
@keyframes flashout{from{opacity:.9}to{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slam{0%{transform:scale(3.2);opacity:0}100%{transform:scale(1);opacity:1}}
.quake{animation:quake .5s}
@keyframes quake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-6px,3px)}40%,60%{transform:translate(6px,-3px)}}
#launch{position:fixed;inset:0;z-index:45;background:var(--space)}
#launch canvas{width:100%;height:100%;display:block}
#launch .ct{position:absolute;left:0;right:0;top:18%;text-align:center;font-family:var(--f-display);font-size:5rem;font-weight:700;color:var(--gold);text-shadow:0 0 30px #ff8a3d}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--gold);color:#2a1d00;font-weight:700;padding:12px 18px;border-radius:99px;z-index:60;box-shadow:0 8px 30px #0008;max-width:calc(100% - 32px);text-align:center;animation:pop .3s}
@keyframes pop{from{transform:translate(-50%,20px);opacity:0}}
.pop{animation:pop2 .45s}
@keyframes pop2{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}}
.hero-done{text-align:center;padding:22px 16px;border-radius:18px;background:radial-gradient(120% 100% at 50% 0%,#ff8a3d33,transparent 70%),var(--panel);border:1px solid #ff8a3d66}
.bigxp{font-family:var(--f-mono);font-size:3rem;font-weight:700;color:var(--gold)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;font-size:.72rem;color:var(--muted)}
.wd.today{background:var(--panel2);color:var(--text)}
.wd .ice{color:var(--cyan);font-size:1.2rem;line-height:26px}.wd .miss{color:var(--muted);font-size:1.4rem;line-height:26px}
.streak-hero{display:flex;align-items:center;justify-content:center;gap:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const fx=$("#fx"),fctx=fx.getContext("2d");let parts=[],fxRun=false;
function sizeFx(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio;}
addEventListener("resize",sizeFx);sizeFx();
function burst(x,y,n,colors){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const d=devicePixelRatio;

 if(!fxRun){fxRun=true;requestAnimationFrame(fxLoop);}}
function star(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){const rr=i%2?r*.45:r,a=i*Math.PI/5-Math.PI/2;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}c.closePath();c.fill();}
function fxLoop(){fctx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.life>0);
 parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.18*devicePixelRatio;p.life-=.016;fctx.globalAlpha=Math.max(0,p.life);fctx.fillStyle=p.c;if(p.star)star(fctx,p.x,p.y,p.s*1.6);else fctx.fillRect(p.x,p.y,p.s,p.s);});
 fctx.globalAlpha=1;if(parts.length)requestAnimationFrame(fxLoop);else{fxRun=false;fctx.clearRect(0,0,fx.width,fx.height);}}
function celebrate(el){const r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};burst(r.left+r.width/2,r.top+r.height/2,40,["#62e3ff","#ffd166","#ff8a3d","#5ff2a0","#ffffff"]);}

/* Raketenstart-Animation */
function launchAnim(done){
 const L=$("#launch"),cv=$("#lc"),ct=$("#lct");L.hidden=false;const c=cv.getContext("2d");const d=devicePixelRatio;
 cv.width=innerWidth*d;cv.height=innerHeight*d;const W=cv.width,H=cv.height;
 const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
 const stars=Array.from({length:120},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.8*d+.4}));
 let smoke=[],t0=performance.now(),liftAt=3000,end=liftAt+3600,shown=-1;
 const hasClip=!!playClip("liftoff",1.1,true);if(!hasClip)SFX.beep(false);
 function rocket(x,y,s){c.save();c.translate(x,y);c.scale(s,s);
  c.fillStyle="#e9edf7";c.beginPath();c.moveTo(0,-90);c.bezierCurveTo(22,-60,24,-10,22,40);c.lineTo(-22,40);c.bezierCurveTo(-24,-10,-22,-60,0,-90);c.fill();
  c.fillStyle="#ff8a3d";c.beginPath();c.moveTo(0,-90);c.bezierCurveTo(12,-74,16,-62,17,-55);c.lineTo(-17,-55);c.bezierCurveTo(-16,-62,-12,-74,0,-90);c.fill();
  c.fillStyle="#1c2550";c.beginPath();c.arc(0,-25,10,0,7);c.fill();c.fillStyle="#62e3ff";c.beginPath();c.arc(0,-25,6,0,7);c.fill();
  c.fillStyle="#ff5d6c";c.beginPath();c.moveTo(-22,10);c.lineTo(-40,48);c.lineTo(-22,40);c.fill();c.beginPath();c.moveTo(22,10);c.lineTo(40,48);c.lineTo(22,40);c.fill();
  c.fillStyle="#9aa5d6";c.fillRect(-14,40,28,8);c.restore();}
 function frame(now){const t=now-t0;c.fillStyle="#0a0f24";c.fillRect(0,0,W,H);
  const lift=Math.max(0,t-liftAt);const speed=lift>0?Math.pow(lift/1000,2.2)*H*.18:0;
  stars.forEach(s=>{s.y+=lift>0?Math.min(30*d,lift/90)*s.s:0;if(s.y>H)s.y-=H;c.fillStyle="#ffffffaa";c.fillRect(s.x,s.y,s.s,s.s*(lift>0?Math.min(12,1+lift/300):1));});
  const gx=W/2,baseY=H*.78,scale=d*1.1;let ry=baseY-48*scale-speed;let shake=t>liftAt-800&&!reduce?(Math.random()-.5)*6*d:0;
  c.fillStyle="#141b38";c.fillRect(0,baseY+speed*.6,W,H);
  if(t>liftAt-900){for(let i=0;i<4;i++)smoke.push({x:gx+(Math.random()-.5)*30*d,y:ry+56*scale,vx:(Math.random()-.5)*4*d,vy:(1+Math.random()*2)*d,r:(8+Math.random()*10)*d,a:.5});}
  smoke.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.8*d;p.a-=.007;});smoke=smoke.filter(p=>p.a>0);
  smoke.forEach(p=>{c.fillStyle="rgba(200,205,230,"+p.a+")";c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();});
  if(t>liftAt-900){const fl=(30+Math.random()*25+(lift>0?40:0))*scale;const g=c.createLinearGradient(0,ry+48*scale,0,ry+48*scale+fl);g.addColorStop(0,"#fff6c8");g.addColorStop(.4,"#ffd166");g.addColorStop(1,"rgba(255,93,60,0)");
   c.fillStyle=g;c.beginPath();c.moveTo(gx-12*scale+shake,ry+48*scale);c.quadraticCurveTo(gx+shake,ry+48*scale+fl*1.3,gx+12*scale+shake,ry+48*scale);c.fill();}
  rocket(gx+shake,ry,scale);
  const sec=Math.ceil((liftAt-t)/1000);
  if(t<liftAt){if(sec!==shown){shown=sec;ct.textContent=sec;if(sec<3&&!hasClip)SFX.beep(false);}}
  else if(shown!==0){shown=0;ct.textContent="LIFTOFF!";SFX.rumble(3.6);if(!hasClip){SFX.beep(true);radio("Liftoff! Wir haben Liftoff! Mission erfüllt, "+KID()+"!");}}
  if(t<end)requestAnimationFrame(frame);else{L.hidden=true;ct.textContent="";done();}}
 requestAnimationFrame(frame);}

function ring(){const C=2*Math.PI*54;return`<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="#1c2550" stroke-width="10"/><circle id="arc" cx="60" cy="60" r="54" fill="none" stroke="#62e3ff" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/><circle id="garc" cx="60" cy="60" r="54" fill="none" stroke="#ffd166" stroke-width="3" stroke-dasharray="2 ${C}" stroke-dashoffset="0" opacity="0"/></svg>`;}

function update(){const now=Date.now();
 if(view==="home"){const lt=leaveTs();let target=lt,sub="";if(now>lt){target=lt+864e5;}
  const diff=(target-now)/1000;const h=Math.floor(diff/3600),m=Math.floor(diff%3600/60),s=Math.floor(diff%60);
  const cd=$("#cd");if(cd)cd.textContent=(h?h+":"+pad(m):m)+":"+pad(s);
  const p=plan();const cs=$("#cdsub");if(cs)cs.textContent=now>lt?"Start morgen um "+S.settings.leave+" Uhr · Wecken "+clock(p.wake):p.tomorrow?"bis zum Start · Mission erfüllt! Wecken morgen "+clock(p.wake):"bis zum Start · Weckzeit laut Plan "+clock(p.wake);return;}
 const r=S.run;if(!r)return;const steps=stepsDef(),st=steps[r.idx];
 const tl=$("#tl");if(tl){const left=(leaveTs(r.start)-now)/1000;tl.innerHTML=left>=0?`<span style="color:var(--good)">T−${fmt(left)}</span>`:`<span style="color:var(--warn)">T+${fmt(-left)}</span>`;}
 const C=2*Math.PI*54;
 if(st.kind==="bed"){
  if(!r.alarmAt){const left=(r.bedEnd-now)/1000;const tm=$("#tm");if(tm)tm.textContent=fmt(left);const arc=$("#arc");if(arc){arc.style.strokeDashoffset=C*(left/(r.lie*60));}
   if(left<=0){r.alarmAt=r.bedEnd;save();startAlarm();render();}}
  else if(!r.upAt){const e=$("#react");if(e)e.textContent=fmt((now-r.alarmAt)/1000);}
  return;}
 if(st.kind==="med")return;
 if(st.kind==="free"){const ft=finalTs(r),left=(ft-now)/1000,tot=Math.max(1,(ft-r.stepStart)/1000);const tm=$("#tm");if(tm)tm.textContent=fmt(left);const arc=$("#arc");if(arc){arc.setAttribute("stroke","#5ff2a0");arc.style.strokeDashoffset=C*(1-Math.max(0,left)/tot);}
  if(left<=0&&!r.freeEnding){r.freeEnding=true;freeDone();}return;}
 if((st.kind==="breakfast"||st.kind==="check")&&!r.med2){const lk=med2Locked(r);const cd=$("#m2cd");if(cd)cd.textContent=fmt((med2Ts(r)-now)/1000);
  if(r.m2lk&&!lk){r.m2lk=false;render();SFX.coin();radio("Mission Control: Jetzt ist Zeit für "+S.settings.med2+"!");return;}}
 const el=(now-r.stepStart)/1000;const tm=$("#tm");if(tm)tm.textContent=fmt(el);
 const g=ghostFor(st.id);const ref=g||DEF_DUR[st.id];const arc=$("#arc");
 if(arc){const frac=Math.min(1,el/(ref*1.0));arc.style.strokeDashoffset=C*(1-frac);arc.setAttribute("stroke",el>ref?"#ff8a3d":"#62e3ff");}
 const sub=$("#sub");if(sub&&g){sub.innerHTML=el<=g?`<span style="color:var(--good)">${fmt(g-el)} Vorsprung</span>`:`<span style="color:var(--warn)">Geist ist ${fmt(el-g)} vorne</span>`;}
 if(g&&el>g&&!r.ghostPassed){r.ghostPassed=true;SFX.soft();}
 // Houston-Nachfrage bei deutlicher Überziehung
 const lim=Math.max(ref*1.5,ref+90);
 if(isMission()&&el>lim&&$("#modal").hidden&&(!r.lastAlert||now-r.lastAlert>120000)){r.lastAlert=now;r.alerts=(r.alerts||0)+1;save();houston();}}

 if(st.kind==="check"&&r.checksAt&&r.checksAt>r.stepStart)dur=Math.round((Math.min(now,r.checksAt)-r.stepStart)/1000);
 const rec={dur,ghost:g,hidden:Math.round(r.hidden/1000),alerts:r.alerts||0,distracted:null};
 rec.beat=!!(g&&dur<g);rec.pb=!!(b&&dur<b);r.steps[st.id]=rec;
 if(rec.beat){save();await bigWin(rec.pb?"pb":"ghost",dur,g-dur,st.title);}else{SFX.done();celebrate(btn);}
 if(rec.alerts>0||rec.hidden>=30){save();const ans=await modal(`<div class="eyebrow">Funkfrage von Houston</div><h2>Hat dich in dieser Phase etwas abgelenkt?</h2><p class="muted" style="margin:0">Ehrlichkeit bringt <b style="color:var(--gold)">+5 XP</b>. Das hilft uns, den Flugplan besser zu machen.</p>

function finish(){const r=S.run,now=Date.now();r.done=now;
 const prevReal=real();const lt=leaveTs(r.start);const onTime=now<=lt;const early=(lt-now)/60000;
 const day={date:r.date,practice:r.practice,start:r.start,upAt:r.upAt,done:now,leave:S.settings.leave,lie:r.lie,lieWhy:r.lieWhy,plannedWake:r.plannedWake,steps:r.steps,onTime,early:Math.round(early*10)/10};
 const freeSec=(r.steps.free&&r.steps.free.dur)||0;day.free=freeSec;
 day.total=Math.round((now-(r.upAt||r.start))/1000)-freeSec;
 // Punkte
 const items=[];const add=(n,t)=>items.push([n,t]);
 add(20,"Beide Tabletten bestätigt");
 const bed=r.steps.bed||{};if(bed.early)add(10,"Schon vor dem Alarm aufgestanden");else if(bed.react<=60)add(10,"Sofort nach dem Alarm aufgestanden");else if(bed.react<=180)add(5,"Nach dem Alarm aufgestanden");
 let focusAll=true,pbs=0,honest=0;
 TASKS.forEach(id=>{const s=r.steps[id];if(!s)return;add(10,stepName(id)+" erledigt");if(s.beat)add(5,"Geist geschlagen: "+stepName(id));if(s.pb){add(5,"Neue Bestzeit: "+stepName(id));pbs++;}
  if(s.alerts>0||s.hidden>=30)focusAll=false;if(s.distracted){add(5,"Ehrlichkeits-Bonus: "+stepName(id));honest++;}});
 if(focusAll)add(15,"Voller Fokus: keine Houston-Nachfrage");
 if(onTime){add(30,"Pünktlich startklar");const e=Math.min(10,Math.floor(early));if(e>0)add(e,e+" Min früher fertig");}
 let st=S.streak.count,freezeUsed=false,milestone=null,lost=0;
 if(!r.practice){if(onTime){if(!st)S.streak.start=r.date;st++;}else if(S.streak.freezes>0){S.streak.freezes--;freezeUsed=true;}else{lost=st;st=0;S.streak.start=null;}
  S.streak.count=st;S.streak.best=Math.max(S.streak.best,st);if(onTime&&MILESTONES.includes(st))milestone=st;}
 else st=onTime?st+1:st;
 if(onTime&&st>=2)add(Math.min(25,5*(st-1)),"Serie: "+st+" Tage in Folge");if(milestone)add(milestone>=10?50:25,"Meilenstein: "+milestone+"-Tage-Serie!");
 day.xp=items.reduce((a,b)=>a+b[0],0);day.items=items;day.streak=st;day.focus=focusAll;day.freezeUsed=freezeUsed;day.milestone=milestone;day.lost=lost;
 day.insights=insights(day);const j=pick(JOKES);day.joke=j;
 if(!r.practice){S.xp+=day.xp;S.xpTotal+=day.xp;S.stats.pbs+=pbs;S.stats.honest+=honest;}
 S.history.push(day);
 // Abzeichen
 day.newBadges=[];if(!r.practice){const nb=id=>{if(!S.badges[id]){S.badges[id]=day.date;day.newBadges.push(id);}};
  nb("first");if(st>=3)nb("streak3");if(st>=5)nb("streak5");if(st>=10)nb("streak10");if(S.stats.pbs>=5)nb("pb5");if(focusAll)nb("focus");if(early>=10)nb("early10");if(S.stats.honest>=3)nb("honest3");}
 const p=plan();day.next={lie:p.lie,why:p.why,wake:p.wake,keep:p.keep||0};
 S.run=null;save();releaseAwake();
 launchAnim(()=>{go("report",S.history.length-1);SFX.fanfare();setTimeout(()=>playClip("smallstep"),2600);setTimeout(()=>celebrate(document.querySelector(".hero-done")),200);});}

function insights(day){const out=[];if((day.free||0)>=180)out.push(["good","Du hattest dir "+Math.round(day.free/60)+" Minuten Freizeit erarbeitet!"]);const t=TASKS.map(id=>({id,s:day.steps[id]})).filter(x=>x.s);
 const withG=t.filter(x=>x.s.ghost);
 if(!withG.length)out.push(["good","Erster Flug im Logbuch! Morgen trittst du gegen diese Zeiten an."]);
 else{const gain=withG.map(x=>({id:x.id,d:x.s.ghost-x.s.dur})).sort((a,b)=>b.d-a.d);
  if(gain[0].d>=15)out.push(["good","Stark: "+stepName(gain[0].id)+" war "+fmt(gain[0].d)+" schneller als gestern."]);
  const loss=gain[gain.length-1];if(loss.d<=-30)out.push(["warn","Potenzial: "+stepName(loss.id)+" war "+fmt(-loss.d)+" langsamer als gestern. "+(TIPS[loss.id]||"")]);}
 const hid=t.reduce((a,x)=>a+(x.s.hidden||0),0);if(hid>=60)out.push(["warn","Du warst insgesamt "+fmt(hid)+" Min außerhalb der App."]);
 const al=t.reduce((a,x)=>a+(x.s.alerts||0),0);if(al>0)out.push(["warn","Houston musste "+al+"-mal nachfragen."]);else out.push(["good","Kein einziges Mal musste Houston nachfragen. Laser-Fokus!"]);
 const bed=day.steps.bed;if(bed&&!bed.early&&bed.react>60)out.push(["warn","Nach dem Alarm hast du "+fmt(bed.react)+" zum Aufstehen gebraucht."]);
 if(day.onTime)out.push(["good",day.early>=1?"Du warst "+Math.floor(day.early)+" Min vor dem Start fertig.":"Punktlandung zum Start!"]);
 else out.push(["warn","Diesmal "+Math.ceil(-day.early)+" Min nach dem Startzeitpunkt fertig. Morgen holen wir die Minuten zurück!"]);
 if(day.freezeUsed)out.push(["good","Dein Streak-Schutz hat die Serie gerettet!"]);

 return header("Belohnungen",true)+`<section class="panel row between" style="flex-wrap:nowrap"><div class="row" style="gap:6px;flex-wrap:nowrap">${flame(36,st>0)}<div><div class="mono" style="font-size:1.6rem;font-weight:700;line-height:1">${st}</div><div class="eyebrow">Tage-Serie</div></div></div><div style="text-align:right"><div class="eyebrow">Punkte</div><div class="mono" style="font-size:1.6rem;font-weight:700;color:var(--gold)">${S.xp} XP</div></div></section>
 <div class="list">${S.settings.rewards.map(rw=>{const rs=rewardState(rw);
  return`<div class="panel reward"><div style="min-width:0"><b>${esc(rw.name)}</b><div class="muted" style="font-size:.85rem">${rw.per==="tag"?(rw.streak>1?rw.streak+" pünktliche Tage in Folge":"Ein pünktlicher Tag")+" · gilt für den Abend":"Alle "+rw.streak+" Serien-Tage einmal"}${rw.cost?" · "+rw.cost+" XP":""}</div><div style="font-size:.85rem;color:${rs.ok?"var(--good)":"var(--muted)"}">${esc(rs.why)}</div></div>
   <button class="btn btn-sm ${rs.ok?"btn-cyan":""}" style="flex:none" data-act="redeem" data-id="${esc(rw.id)}" ${rs.ok?"":"disabled"}>${esc(rs.label)}</button></div>`;}).join("")}</div>
 <section class="panel stack"><div class="row between"><h3>Streak-Schutz</h3><span class="chip">${S.streak.freezes}/${FREEZE_MAX}</span></div>
  <div class="muted" style="font-size:.9rem">Rettet deine Serie, wenn eine Mission mal nicht pünktlich klappt. Wird automatisch eingesetzt.</div>
  <button class="btn ${S.xp>=FREEZE_COST&&S.streak.freezes<FREEZE_MAX?"btn-cyan":""}" data-act="freeze" ${S.xp>=FREEZE_COST&&S.streak.freezes<FREEZE_MAX?"":"disabled"}>Kaufen für ${FREEZE_COST} XP</button></section>
 ${S.redemptions.length?`<section class="panel stack"><h3>Eingelöst</h3>${S.redemptions.slice(-8).reverse().map(x=>`<div class="row between"><span>${esc(x.name)}</span><span class="muted mono">${dayLabel(x.date)}</span></div>`).join("")}</section>`:""}`;}
async function redeem(id){const rw=S.settings.rewards.find(x=>x.id===id);if(!rw||!rewardState(rw).ok)return;if(!await parentOk("Einlösen: "+rw.name,rw.cost?rw.cost+" XP werden abgezogen.":"Eltern geben die Belohnung frei."))return;
 S.xp-=(rw.cost||0);if(rw.per==="meilenstein"){const mk=S.marks[rw.id];const base=(mk&&mk.start===S.streak.start)?mk.at:0;S.marks[rw.id]={start:S.streak.start,at:base+rw.streak};}
 S.redemptions.push({id,name:rw.name,cost:rw.cost||0,date:dayKey()});save();SFX.fanfare();render();toast(rw.name+" eingelöst!");celebrate();}
function buyFreeze(){if(S.xp<FREEZE_COST||S.streak.freezes>=FREEZE_MAX)return;S.xp-=FREEZE_COST;S.streak.freezes++;save();SFX.coin();render();toast("Streak-Schutz aktiviert");celebrate();}

/* ============ Logbuch & Abzeichen ============ */
function vLog(){const h=S.history.map((d,i)=>({d,i})).filter(x=>!x.d.practice);const last=h.slice(-14);const mx=Math.max(1,...last.map(x=>x.d.total||0));
 return header("Logbuch",true)+(h.length?`<section class="panel stack"><div class="row between"><h3>Routine-Dauer</h3><span class="muted" style="font-size:.85rem">letzte ${last.length} Missionen</span></div>
  <div class="bars">${last.map(x=>`<i class="${x.d.onTime?"":"late"}" style="height:${Math.round((x.d.total||0)/mx*100)}%" title="${dayLabel(x.d.date)}: ${fmt(x.d.total)}"></i>`).join("")}</div>
  <div class="row muted" style="font-size:.8rem"><span class="chip good">pünktlich</span><span class="chip warn">zu spät</span></div></section>`:`<div class="panel muted">Noch keine Missionen im Logbuch. Nach dem ersten Start erscheint hier jeder Tag mit Bericht.</div>`)+
 `<div class="list">${S.history.map((d,i)=>({d,i})).reverse().map(({d,i})=>`<button class="logitem" data-act="openrep" data-i="${i}"><span><b>${dayLabel(d.date)}</b> <span class="muted">${d.practice?"Probelauf":"fertig "+clock(d.done)}</span></span><span class="row" style="gap:6px;flex-wrap:nowrap"><span class="chip ${d.onTime?"good":"warn"}">${d.onTime?"pünktlich":"spät"}</span><span class="mono" style="color:var(--gold)">+${d.practice?0:d.xp}</span></span></button>`).join("")}</div>`;}
function vBadges(){return header("Abzeichen",true)+`<div class="list">${BADGES.map(b=>`<div class="badge ${S.badges[b.id]?"":"off"}"><div class="medal">${esc(b.m)}</div><div><b>${esc(b.n)}</b><div class="muted" style="font-size:.85rem">${esc(b.d)}${S.badges[b.id]?" · "+dayLabel(S.badges[b.id]):""}</div></div></div>`).join("")}</div>
 <section class="panel stack"><h3>Ränge</h3>${RANKS.map(([x,n])=>`<div class="row between"><span>${S.xpTotal>=x?"<b>"+esc(n)+"</b>":'<span class="muted">'+esc(n)+"</span>"}</span><span class="mono muted">${x} XP</span></div>`).join("")}</section>`;}

/* ============ Einrichtung & Geräte ============ */
let lastInvite=null;
function vSetup(){const ready=!!uid;
 return`<div class="topbar"><div class="brand">Mission <b>Morgenstart</b></div><span class="sync ${syncState}"></span></div>
 <section class="panel stack"><h1>Willkommen an Bord!</h1><p class="muted" style="margin:0">Dieses Gerät ist noch mit keiner Familie verbunden. ${ready?"":"Verbinde mit dem Server …"}</p></section>
 <section class="panel stack"><h2>Neue Familie erstellen</h2><p class="muted" style="margin:0;font-size:.9rem">Nur einmal, auf dem ersten Gerät.</p>
  <label class="f">Dieses Gerät ist<select id="s-role"><option value="mission">Mission-Gerät (das Kind spielt hier)</option><option value="parent">Eltern-Gerät</option></select></label>
  <div class="grid2"><label class="f">Name dieses Geräts<input id="s-name" placeholder="z. B. Papas iPhone"></label><label class="f">Name des Kindes<input id="s-kid" placeholder="Vorname"></label></div>
  <button class="btn btn-go" data-act="mkfam" ${ready?"":"disabled"}>Familie erstellen</button></section>
 <section class="panel stack"><h2>Einer Familie beitreten</h2><p class="muted" style="margin:0;font-size:.9rem">Den Code erzeugst du auf einem schon gekoppelten Gerät unter Elternbereich → Geräte &amp; Familie.</p>
  <label class="f">Einladungscode<input id="s-code" placeholder="8 Zeichen" autocapitalize="characters" autocomplete="off" style="font-family:var(--f-mono);letter-spacing:.15em;text-transform:uppercase"></label>
  <label class="f">Name dieses Geräts<input id="s-jname" placeholder="z. B. Mamas iPhone"></label>
  <button class="btn btn-cyan" data-act="join" ${ready?"":"disabled"}>Beitreten</button></section>
 ${syncState==="error"?`<div class="panel muted">Keine Verbindung zum Server. Prüfe die Internetverbindung und öffne die App neu.</div>`:""}`;}
function vDevices(){const mem=FAM&&FAM.members?Object.entries(FAM.members):[];const RN={mission:"Mission-Gerät",parent:"Eltern-Gerät"};
 return header("Geräte & Familie",true)+`
 <section class="panel stack"><h3>Gekoppelte Geräte</h3>${mem.length?mem.sort((a,b)=>(a[1].joined||0)-(b[1].joined||0)).map(([id,m])=>`<div class="stack" style="border-top:1px solid var(--line);padding-top:10px;gap:8px"><div class="row between"><b>${esc(m.name||"Gerät")}${id===uid?' <span class="chip good">dieses Gerät</span>':""}</b><span class="chip">${RN[m.role]||m.role}</span></div>
  <div class="row"><button class="btn btn-sm" data-act="setrole" data-id="${esc(id)}" data-role="${m.role==="parent"?"mission":"parent"}">Zu ${m.role==="parent"?"Mission-Gerät":"Eltern-Gerät"} machen</button>${id!==uid?`<button class="btn btn-sm btn-ghost" style="color:var(--bad)" data-act="rmdev" data-id="${esc(id)}">Entfernen</button>`:""}</div></div>`).join(""):'<div class="muted">Lade …</div>'}</section>
 <section class="panel stack"><h3>Neues Gerät einladen</h3><p class="muted" style="margin:0;font-size:.9rem">Code auf dem neuen Gerät unter „Einer Familie beitreten“ eingeben. Gilt 24 Stunden und nur einmal.</p>
  <div class="grid2"><button class="btn btn-sm" data-act="invite" data-role="parent">Eltern-Gerät</button><button class="btn btn-sm" data-act="invite" data-role="mission">Mission-Gerät</button></div>
  ${lastInvite&&lastInvite.exp>Date.now()?`<div class="code">${lastInvite.code.slice(0,4)} ${lastInvite.code.slice(4)}</div><div class="muted" style="text-align:center;font-size:.85rem">Für ein ${RN[lastInvite.role]} · gültig bis ${clock(lastInvite.exp)} Uhr morgen</div>`:""}</section>
 <section class="panel stack"><h3>Wie die Geräte sich unterscheiden</h3><div class="muted" style="font-size:.9rem"><b>Mission-Gerät:</b> Alarm, Funksprüche, Ablenkungs-Messung. Eltern-Aktionen nur mit PIN.<br><b>Eltern-Gerät:</b> Live-Ansicht, bestätigt Tabletten und Belohnungen ohne PIN, keine Alarme.</div></section>
 <button class="btn" data-act="leave" style="color:var(--bad)">Dieses Gerät abmelden</button>`;}

/* ============ Elternbereich ============ */
let parentOpen=false;
function vParent(){const s=S.settings;
 return header("Elternbereich",true)+`
 <section class="panel stack"><h3>Mission</h3>
  <label class="f">Name des Kindes<input id="p-kid" value="${esc(s.kid||"")}"></label>
  <div class="grid2"><label class="f">Losgehzeit<input type="time" id="p-leave" value="${esc(s.leave)}"></label><label class="f">Puffer (Min)<input type="number" id="p-buffer" min="0" max="30" value="${s.buffer}"></label></div>
  <div class="grid2"><label class="f">Weckzeit<select id="p-wm"><option value="auto" ${s.wakeMode==="auto"?"selected":""}>Berechnet</option><option value="fix" ${s.wakeMode==="fix"?"selected":""}>Fest</option></select></label><label class="f">Feste Weckzeit<input type="time" id="p-wf" value="${esc(s.wakeFix)}"></label></div>
  <label class="f">Liegezeit nach der ersten Tablette<select id="p-lie"><option value="auto" ${s.lieMode==="auto"?"selected":""}>Automatisch: 5 oder 10 Min nach Leistung</option><option value="fix5" ${s.lieMode==="fix5"?"selected":""}>Immer 5 Min</option><option value="fix10" ${s.lieMode==="fix10"?"selected":""}>Immer 10 Min</option></select></label>
  <div class="grid2"><label class="f">Tablette 1 (Wecken)<input id="p-med1" value="${esc(s.med1)}"></label><label class="f">Tablette 2 (Frühstück)<input id="p-med2" value="${esc(s.med2)}"></label></div>
  <label class="f">Finaler Countdown startet … Min vor der Losgehzeit<input type="number" id="p-final" min="3" max="30" value="${s.finalMin}"></label>
  <label class="f">Tablette 2 frühestens … Min vor der Losgehzeit (0 = keine Sperre)<input type="number" id="p-m2gap" min="0" max="120" value="${s.med2Gap}"></label>
  <label class="f">Systemcheck (ein Punkt pro Zeile)<textarea id="p-checks">${esc(s.checks.join("\n"))}</textarea></label>
  <div class="grid2"><label class="f">Sounds (dieses Gerät)<select id="p-sound"><option value="1" ${DEV.sound?"selected":""}>An</option><option value="0" ${DEV.sound?"":"selected"}>Aus</option></select></label><label class="f">Funksprüche (Stimme)<select id="p-voice"><option value="1" ${DEV.voice?"selected":""}>An</option><option value="0" ${DEV.voice?"":"selected"}>Aus</option></select></label></div>
 </section>
 <section class="panel stack"><h3>Belohnungen</h3><p class="muted" style="margin:0;font-size:.88rem"><b>Täglich:</b> einlösbar am Abend eines pünktlichen Tages, wenn die Serie mindestens so lang ist. <b>Meilenstein:</b> einmal alle N Serien-Tage. XP-Kosten sind optional (0 = keine).</p>
  <div class="list" id="p-rw">${s.rewards.map(rw=>rwRow(rw)).join("")}</div><button class="btn btn-sm" data-act="rwadd">+ Belohnung hinzufügen</button></section>
 <button class="btn btn-cyan" data-act="psave">Einstellungen speichern</button>
 <section class="panel stack"><h3>Punkte</h3><div class="row" style="flex-wrap:nowrap"><input type="number" id="p-xp" placeholder="z. B. 20 oder -20" style="flex:1"><button class="btn btn-sm" data-act="pxp">Buchen</button></div><div class="muted" style="font-size:.85rem">Aktuell ${S.xp} XP zum Einlösen, ${S.xpTotal} XP gesamt.</div></section>
 <section class="panel stack"><h3>Werkzeuge</h3>
  <button class="btn" data-act="practice">Probelauf starten (zählt nicht)</button>
  <button class="btn" data-act="devices">Geräte &amp; Familie</button></section>
 <section class="panel stack"><h3>Effekte testen</h3><div class="grid2">
  <button class="btn btn-sm" data-act="pv" data-k="ghost">Geist geschlagen</button><button class="btn btn-sm" data-act="pv" data-k="pb">Neue Bestzeit</button>
  <button class="btn btn-sm" data-act="pv" data-k="launch">Raketenstart</button><button class="btn btn-sm" data-act="pv" data-k="alarm">Weck-Alarm</button>
  <button class="btn btn-sm" data-act="pv" data-k="radio">Funkspruch</button><button class="btn btn-sm" data-act="pv" data-k="step">Small Step</button></div>
  <button class="btn" data-act="pin">Eltern-PIN ändern</button>
  <button class="btn" data-act="wipe" style="color:var(--bad)">Fortschritt zurücksetzen</button></section>
 <p class="muted" style="font-size:.8rem;margin:0">Funksprüche: NASA-Originalaufnahmen via Wikimedia Commons – Apollo 8 Liftoff (1968), Apollo 11 „The Eagle has landed“ und „One small step“ (1969), Apollo 13 „Houston, we've had a problem“ (1970).</p>
 <p class="muted" style="font-size:.8rem;margin:0">Die App erinnert nur und protokolliert. Medikamente und Zeiten wie ärztlich verordnet.</p>`;}
function rwRow(rw){return`<div class="stack rw" data-id="${esc(rw.id)}" style="border-top:1px solid var(--line);padding-top:10px"><input class="rw-name" value="${esc(rw.name)}" aria-label="Name der Belohnung"><div class="grid2"><label class="f">Art<select class="rw-per"><option value="tag" ${rw.per==="tag"?"selected":""}>Täglich</option><option value="meilenstein" ${rw.per==="meilenstein"?"selected":""}>Meilenstein</option></select></label><label class="f">Serie (Tage)<input type="number" class="rw-streak" value="${rw.streak}" min="1" max="100"></label></div><label class="f">XP-Kosten<input type="number" class="rw-cost" value="${rw.cost||0}" min="0"></label><button class="btn btn-sm btn-ghost" data-act="rwdel" style="color:var(--bad)">Entfernen</button></div>`;}
function readRewards(){return[...document.querySelectorAll("#p-rw .rw")].map(el=>({id:el.dataset.id,name:el.querySelector(".rw-name").value.trim()||"Belohnung",per:el.querySelector(".rw-per").value,streak:Math.max(1,parseInt(el.querySelector(".rw-streak").value)||1),cost:Math.max(0,parseInt(el.querySelector(".rw-cost").value)||0)}));}
function saveParent(){const s=S.settings;s.leave=$("#p-leave").value||s.leave;s.buffer=Math.max(0,Math.min(30,parseInt($("#p-buffer").value)||0));s.lieMode=$("#p-lie").value;s.wakeMode=$("#p-wm").value;s.wakeFix=$("#p-wf").value||s.wakeFix;
 s.med1=$("#p-med1").value.trim()||"Tablette 1";s.med2=$("#p-med2").value.trim()||"Tablette 2";s.med2Gap=Math.max(0,Math.min(120,parseInt($("#p-m2gap").value)||0));s.finalMin=Math.max(3,Math.min(30,parseInt($("#p-final").value)||10));s.checks=$("#p-checks").value.split("\n").map(x=>x.trim()).filter(Boolean);if(!s.checks.length)s.checks=["Brille auf"];
 DEV.sound=$("#p-sound").value==="1";DEV.voice=$("#p-voice").value==="1";saveDev();s.kid=$("#p-kid").value.trim()||s.kid;s.rewards=readRewards();save();SFX.coin();toast("Gespeichert");}

/* ============ Events ============ */
document.addEventListener("click",async e=>{const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;audioInit();
 if(a!=="sound")SFX.tap();
 switch(a){
  case"home":go("home");break;
  case"unlock":render();break;
  case"freedone":freeDone();break;
  case"devices":go("devices");break;
  case"mkfam":{const role=$("#s-role").value,name=$("#s-name").value.trim()||"Gerät",kid=$("#s-kid").value.trim();createFamily(role,name,kid);break;}
  case"join":{const c=$("#s-code").value,name=$("#s-jname").value.trim()||"Gerät";if(c.replace(/\s/g,"").length<8){toast("Bitte den 8-stelligen Code eingeben");break;}joinFamily(c,name);break;}
  case"invite":{try{const code=await createInvite(t.dataset.role);if(code){lastInvite={code,role:t.dataset.role,exp:Date.now()+24*3600e3};render();}}catch(e){syncErr(e);toast("Einladung fehlgeschlagen: "+(e.code||e.message));}break;}
  case"rmdev":{const id=t.dataset.id;const ok=await modal(`<h2>Gerät entfernen?</h2><p class="muted" style="margin:0">Es kann danach nicht mehr auf die Daten zugreifen.</p><button class="btn" data-v="0">Abbrechen</button><button class="btn" data-v="1" style="color:var(--bad)">Entfernen</button>`,(b,close)=>b.addEventListener("click",ev=>{const k=ev.target.closest("[data-v]");if(k)close(k.dataset.v==="1");}));if(ok){try{await removeMember(id);}catch(e){toast("Fehlgeschlagen: "+(e.code||e.message));}}break;}
  case"setrole":{try{await setRole(t.dataset.id,t.dataset.role);toast("Rolle geändert");}catch(e){toast("Fehlgeschlagen: "+(e.code||e.message));}break;}
  case"leave":{const ok=await modal(`<h2>Dieses Gerät abmelden?</h2><p class="muted" style="margin:0">Die Daten bleiben in der Familie. Zum erneuten Koppeln brauchst du einen neuen Code.</p><button class="btn" data-v="0">Abbrechen</button><button class="btn" data-v="1" style="color:var(--bad)">Abmelden</button>`,(b,close)=>b.addEventListener("click",ev=>{const k=ev.target.closest("[data-v]");if(k)close(k.dataset.v==="1");}));if(ok){try{await removeMember(uid);}catch(e){}leaveLocal("Gerät abgemeldet");}break;}
  case"start":startMission();break;
  case"shop":go("shop");break;case"log":go("log");break;case"badges":go("badges");break;
  case"openrep":go("report",+t.dataset.i);break;
  case"sound":DEV.sound=!DEV.sound;saveDev();render();SFX.coin();break;
  case"parent":if(await parentOk("Elternbereich"))go("parent");break;
  case"med1":confirmMed1();break;
  case"up":getUp();break;
  case"med2":confirmMed2();break;
  case"chk":{const i=+t.dataset.i;S.run.checks[i]=!S.run.checks[i];if(S.settings.checks.every((c,j)=>S.run.checks[j])){if(!S.run.checksAt)S.run.checksAt=Date.now();}else S.run.checksAt=null;save();render();if(S.run.checks[i]){SFX.coin();celebrate(document.querySelector(`[data-act=chk][data-i="${i}"]`));}break;}
  case"next":t.disabled=true;completeTask(t);break;
  case"abort":if(await parentOk("Mission abbrechen?","Der heutige Lauf wird verworfen.")){alarmStop();S.run=null;save();releaseAwake();go("home");}break;
  case"redeem":redeem(t.dataset.id);break;
  case"freeze":buyFreeze();break;
  case"pv":{const k=t.dataset.k;
   if(k==="ghost")bigWin("ghost",95,23,"Vorschau · Zähne putzen");
   else if(k==="pb")bigWin("pb",184,41,"Vorschau · Anziehen");
   else if(k==="launch")launchAnim(()=>{SFX.fanfare();setTimeout(()=>celebrate(),200);});
   else if(k==="alarm"){const d=playClip("problem");setTimeout(()=>{alarmStart();setTimeout(alarmStop,3500);},d?d*1000+600:0);}
   else if(k==="radio")radio("Houston an "+KID()+": Funkcheck. Hörst du mich? Over.");
   else if(k==="step"){if(!playClip("smallstep"))toast("Clip noch nicht geladen – gleich nochmal tippen");}
   break;}
  case"psave":saveParent();break;
  case"rwadd":{const rw={id:"r"+Date.now(),name:"Neue Belohnung",per:"tag",streak:1,cost:0};$("#p-rw").insertAdjacentHTML("beforeend",rwRow(rw));break;}
  case"rwdel":t.closest(".rw").remove();break;
  case"pxp":{const n=parseInt($("#p-xp").value);if(!n)break;S.xp=Math.max(0,S.xp+n);if(n>0)S.xpTotal+=n;save();render();toast((n>0?"+":"")+n+" XP gebucht");break;}
  case"practice":{saveParent();const p=plan();S.run={v:2,date:dayKey(),practice:true,idx:0,start:null,lie:p.lie,lieWhy:p.why,plannedWake:p.wake,steps:{},checks:{},med2:false,stepStart:Date.now(),hidden:0,alerts:0};save();keepAwake();go("mission");radio("Probelauf. Mission Control ist bereit.");break;}
  case"pin":if(await setupPin())render();break;
  case"wipe":{const ok=await modal(`<h2>Fortschritt zurücksetzen?</h2><p class="muted" style="margin:0">Logbuch, Punkte, Serie, Abzeichen und eingelöste Belohnungen werden auf allen Geräten gelöscht. Einstellungen und PIN bleiben.</p><button class="btn" data-v="0">Abbrechen</button><button class="btn" data-v="1" style="color:var(--bad)">Ja, alles löschen</button>`,(b,close)=>b.addEventListener("click",ev=>{const k=ev.target.closest("[data-v]");if(k)close(k.dataset.v==="1");}));
   if(ok){const keep=S.settings;S=fresh();S.settings=keep;migrate();save();go("home");toast("Fortschritt zurückgesetzt");}break;}
 }});
document.addEventListener("visibilitychange",()=>{const r=S.run;if(!r||!isMission())return;const now=Date.now();
 if(document.hidden){if(r.idx>=2)r.hiddenSince=now;save();}
 else{if(r.hiddenSince){r.hidden=(r.hidden||0)+(now-r.hiddenSince);r.hiddenSince=null;save();}keepAwake();
  if(A.ctx&&A.ctx.state!=="running")A.ctx.resume();
  if(r.idx===1&&!r.upAt&&now>=r.bedEnd){if(!r.alarmAt){r.alarmAt=r.bedEnd;save();}startAlarm();render();}}});
if(S.run&&S.run.idx===1&&S.run.alarmAt&&!S.run.upAt){/* Alarm läuft nach Neuladen weiter, sobald getippt wird */}
render();initSync();
</script>
</body>
</html>
